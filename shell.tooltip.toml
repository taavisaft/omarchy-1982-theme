# Colours are literal hex, not role tokens. Only some consumers resolve a role
# name: Color.composed() and flatColor() do, but Color.pick() -- which backs
# every *.text, *.selected-text, *.text-error and notifications.countdown --
# returns the raw string, so a role there renders as an invalid colour, i.e.
# black on black. Hex is correct on every path.
background       = "#000000"
background-alpha = 1.0
text             = "#33FF33"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0
