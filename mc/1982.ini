[skin]
    description = 1982 — IBM 5151 green phosphor
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

# Straight from the theme's colors.toml. A monochrome tube separates things by
# luminance, so every alias here is the same hue at a different brightness.
[aliases]
    Base           = #000000
    Raised         = #0A1A0A
    Sel            = #0D3B0D
    Dimmest        = #146014
    Muted          = #1B871B
    Dim            = #1A8F1A
    Phosphor       = #33FF33
    Light          = #66FF66
    Bright         = #C8FFC8
    Alert          = #B1FFB1

[core]
    _default_ = Phosphor;Base
    selected = Base;Phosphor
    marked = Bright;;bold
    markselect = Base;Bright;bold
    gauge = Base;Phosphor
    input = Bright;Raised
    inputunchanged = Muted;Raised
    inputmark = Base;Phosphor
    disabled = Dimmest;Base
    reverse = Base;Phosphor
    commandlinemark = Base;Phosphor
    header = Bright
    shadow = #000000;#000000

[dialog]
    _default_ = Phosphor;Raised
    dfocus = Bright;Sel
    dhotnormal = Bright;;underline
    dhotfocus = Bright;Sel;underline
    dtitle = Bright;;bold

# No red to spend, so an error is the brightest thing on the tube.
[error]
    _default_ = Base;Alert
    errdfocus = Base;Bright
    errdhotnormal = Base;Alert;underline
    errdhotfocus = Base;Bright;underline
    errdtitle = Base;Alert;bold

# File types separate by brightness: directories brightest, junk dimmest.
[filehighlight]
    directory = Bright
    executable = Light
    symlink = Phosphor
    hardlink = Muted
    stalelink = Alert
    device = Light
    special = Phosphor
    core = Alert
    temp = Dimmest
    archive = Dim
    doc = Phosphor
    source = Light
    media = Dim
    graph = Dim
    database = Dim

[menu]
    _default_ = Phosphor;Base
    menusel = Base;Phosphor
    menuhot = Bright;;underline
    menuhotsel = Base;Bright;underline
    menuinactive = Dimmest;Base

[popupmenu]
    _default_ = Phosphor;Raised
    menusel = Bright;Sel
    menutitle = Bright;;bold

[buttonbar]
    hotkey = Base;Phosphor
    button = Muted;Base

[statusbar]
    _default_ = Phosphor;Sel

[help]
    _default_ = Phosphor;Raised
    helpbold = Bright;;bold
    helpitalic = Light;;italic
    helplink = Light;;underline
    helpslink = Base;Phosphor

[editor]
    editbold = Bright;;bold
    editmarked = Base;Sel
    editwhitespace = ;#0F2A0F
    editnonprintable = ;Dimmest
    editlinestate = Dim;Base
    bookmark = Base;Phosphor
    bookmarkfound = Base;Bright
    editrightmargin = ;#0F2A0F
    editbg = ;Base
    editframe = Muted
    editframeactive = Phosphor
    editframedrag = Bright

[viewer]
    viewbold = Bright;;bold
    viewunderline = Light;;underline
    viewselected = Base;Sel

[diffviewer]
    added = ;#0F3A0F
    changedline = ;#123812
    changednew = ;#154515
    changed = ;#0F2A0F
    removed = ;#0A2A0A
    error = Base;Alert

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ◆
    background-char = ░

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
